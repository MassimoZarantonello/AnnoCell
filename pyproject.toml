[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "annocell"
version = "0.1.0"
description = "Correct a proposed cell segmentation in napari, cell by cell, and record what was checked"
readme = "README.md"
requires-python = ">=3.12,<3.15"
# The folder format only: what a pipeline needs to export images and read the corrections back.
dependencies = [
  "numpy",
  "tifffile",
]

[project.optional-dependencies]
# The napari tool, for the annotator.
gui = [
  "napari[pyqt6]>=0.5",
  "scipy",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
annocell = "annocell.app:main"

[tool.hatch.build.targets.wheel]
packages = [ "src/annocell" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 120
src = [ "src", "tests" ]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B" ]
